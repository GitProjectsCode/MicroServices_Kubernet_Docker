apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: local-microservices
  labels:
    app: inventory-service
    service: inventory-service
spec:
  type: NodePort
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      nodePort: 30083
