apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: local-microservices
  labels:
    app: product-service
    service: product-service
spec:
  type: NodePort
  selector:
    app: product-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
